<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>吉祥物预览</title>
<style>
  body{font-family:'PingFang SC',sans-serif;background:linear-gradient(180deg,#FFE3B0,#BFE6FF);min-height:100vh;padding:40px;color:#3D2812}
  .head{text-align:center;margin-bottom:30px}
  .head h1{font-size:28px;font-weight:900;letter-spacing:3px}
  .head p{margin-top:8px;font-size:14px;color:#7A4F1B}
  .stage{max-width:900px;margin:0 auto;background:rgba(255,255,255,.6);border-radius:24px;padding:40px;box-shadow:0 12px 40px rgba(0,30,60,.15);text-align:center}
  .tip{margin-top:20px;font-size:13px;color:#5C7A8C;line-height:1.7}
  .tip strong{color:#3D2812}
</style>
</head>
<body>
<div class="head">
  <h1>🎭 宝山吉祥物预览</h1>
  <p>SVG 重画版 · 可挥手/眨眼/跳跃/旋转/害羞 · 点一点试试</p>
</div>
<div class="stage">
  <div id="mascots"></div>
  <div class="tip">
    💡 点击吉祥物会随机触发 5 种动作之一（挥手 / 跳跃 / 旋转 / 害羞 / 眨眼），并冒出对话气泡<br>
    💡 待机时每隔 4-7 秒会自动眨一次眼，每隔 9-14 秒可能自动挥一次手<br>
    💡 想换成原 PNG 图片：把 <strong>mascot-girl.png</strong> 和 <strong>mascot-boy.png</strong> 放到 <strong>assets/</strong> 文件夹，把 mascots.js 顶部的 <strong>MASCOT_USE_PNG</strong> 改为 <strong>true</strong>
  </div>
</div>
<script src="assets/mascots.js"></script>
<script>
  mountMascots('#mascots', {scale: 1.3});
</script>
</body>
</html>
