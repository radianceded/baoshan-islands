<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>餐食历史 · 宝山实验</title>
<script>window.BS_DINGTALK_CORP_ID='__INJECT_CORP_ID__';window.BS_CAMPUS_ID='__INJECT_CAMPUS_ID__';</script>
<script src="https://g.alicdn.com/dingding/dingtalk-jsapi/2.13.42/dingtalk.open.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f8fc;color:#1f3a4d;font:16px/1.6 "PingFang SC","Microsoft YaHei",sans-serif}header{background:white;padding:16px 24px;border-bottom:1px solid #d5e7ef}main{max-width:1060px;margin:auto;padding:20px}h1{font-size:24px;margin:12px 0}h2{font-size:20px;margin:0 0 12px}a{color:#116c8b}button,select,input{font:inherit}button,.button{border:0;border-radius:10px;background:#157696;color:white;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.5;cursor:wait}select,input[type=text]{padding:9px;border:1px solid #b4d1df;border-radius:8px;max-width:100%}.filters{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.panel{background:white;padding:22px;border:1px solid #d5e7ef;border-radius:16px;margin:16px 0}.muted{color:#587382;font-size:14px}.notice{background:#fff5d9;padding:12px;border-radius:8px;white-space:pre-wrap}.error{color:#af293b}#status{min-height:26px;white-space:pre-wrap}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #dfebf1;text-align:left;padding:10px;vertical-align:top}.scroll{overflow:auto}#photo{max-width:100%;max-height:480px;display:block;cursor:zoom-in}#localPreview{max-width:100%;max-height:240px;margin:12px 0}.row{margin:12px 0}.zoom{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.9);overflow:auto;padding:70px 12px 20px;text-align:center}.zoom img{max-width:100%;height:auto}.zoom button{position:fixed;top:14px;right:20px}.hidden,[hidden]{display:none!important}@media(max-width:600px){main{padding:12px}.panel{padding:16px}header{padding:12px}h1{font-size:22px}th,td{padding:8px 6px}}
</style>
<script src="/assets/dingtalk-bootstrap.js"></script>
<script src="/assets/user-auth.js?v=20260826-persistent-login"></script>
<script src="/assets/meal-history.js?v=20260914" defer></script>
</head>
<body>
<header><a id="back" href="/island-health.html">← 返回健康岛</a> · 宝山实验</header>
<main>
<h1>餐食历史记录</h1>
<p class="muted">按供餐周次留存菜单、选餐结果和餐食实拍。实拍照片可以在供餐结束后补传。</p>
<div class="filters"><label>学期 <select id="semester" aria-label="学期"></select></label><label>周次 <select id="week" aria-label="周次"></select></label></div>
<div id="status" role="status" aria-live="polite">正在验证身份并加载…</div>
<section id="uploadPanel" class="panel" hidden>
<h2>餐食实拍上传</h2><p class="muted">每周一张汇总图；请先将同周餐食照片拼成一张。仅支持 JPEG、PNG、WebP，最大20MB、2400万像素。上传时间不会改变照片所属周次。</p>
<form id="uploadForm"><p id="uploadTarget"></p><input id="file" type="file" accept="image/jpeg,image/png,image/webp" required aria-label="选择餐食实拍图片"><img id="localPreview" hidden alt="待上传照片预览">
<label id="replaceLabel" class="row" hidden><input id="replace" type="checkbox"> 我已核对周次，确认替换当前照片（旧版本保留）</label>
<div class="row"><button id="uploadButton" type="submit">上传并发布</button></div></form>
</section>
<div id="content" hidden>
<section class="panel"><h2>当周餐食实拍</h2><p id="photoStatus" class="muted"></p><img id="photo" hidden loading="lazy" alt="当周餐食实拍，点击查看大图" tabindex="0"></section>
<section class="panel"><h2>菜单与选餐记录</h2><p id="archiveStatus" class="muted"></p><div id="warnings" class="notice" hidden></div><p id="scope" class="muted"></p><div class="scroll"><table><thead><tr><th>日期</th><th>菜单 / 供餐说明</th><th>A餐</th><th>B餐</th></tr></thead><tbody id="days"></tbody></table></div>
<div class="row"><button id="export" hidden>下载选餐记录 Excel</button></div>
<details id="details"><summary>查看选餐明细</summary><p class="muted">这里只展示当前账号有权查看的记录。</p><div class="scroll"><table><thead><tr><th>年级 / 班级</th><th>姓名</th><th>日期</th><th>选择</th></tr></thead><tbody id="choices"></tbody></table></div><div class="row"><button id="previousPage">上一页</button> <span id="pageInfo"></span> <button id="nextPage">下一页</button></div></details>
</section>
<section id="revisionPanel" class="panel" hidden><h2>归档核对</h2><p class="muted">历史记录不会随名册或实时数据自动改变。确认实时数据正确后，可填写原因生成新版本；旧版本保留。此操作不会补选或修改实时选餐。</p><form id="revisionForm"><input id="reason" type="text" maxlength="300" required placeholder="填写归档或修正原因" aria-label="归档修正原因"><button id="revisionButton">确认生成归档版本</button></form></section>
</div>
</main>
<div id="zoom" class="zoom" hidden role="dialog" aria-modal="true" aria-label="餐食实拍大图"><button id="closeZoom">关闭大图</button><img id="largePhoto" alt="餐食实拍大图"></div>
</body></html>
