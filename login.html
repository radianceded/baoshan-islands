<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 宝山学习群岛</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:'PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;color:#1F3A4D}
  body{
    background:
      radial-gradient(120% 60% at 50% 100%, rgba(8,32,55,0.32), transparent 62%),
      radial-gradient(75% 45% at 88% 14%, rgba(255,212,150,0.38), transparent 65%),
      linear-gradient(180deg,#E8C18A 0%, #C0D7E5 50%, #4A85AD 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-card{
    background:#fff;border-radius:28px;width:480px;max-width:100%;
    padding:36px 32px;box-shadow:0 40px 80px rgba(0,30,60,.35);
  }
  .logo-row{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .logo-row .badge{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FFE9A6,#D5762A);font-size:28px}
  .logo-row .title{font-size:18px;font-weight:900;color:#1F3A4D;letter-spacing:2px}
  .logo-row .sub{font-size:11px;color:#7BB8DA;font-weight:700;margin-top:2px;letter-spacing:.5px}
  h1{font-size:24px;font-weight:900;color:#1F3A4D;letter-spacing:3px;margin-bottom:6px}
  .greeting{font-size:13px;color:#7BB8DA;font-weight:700;margin-bottom:22px;letter-spacing:1px}
  .form-row{margin-bottom:14px}
  .form-row label{display:block;font-size:12px;color:#5C7A8C;font-weight:800;margin-bottom:6px;letter-spacing:1px}
  .form-row input{
    width:100%;padding:13px 16px;border:2px solid #DCEBF3;border-radius:14px;
    font-size:15px;color:#1F3A4D;outline:none;background:#F4FAFD;font-family:inherit;transition:all .15s;
  }
  .form-row input:focus{border-color:#5BC8E8;background:#fff}
  .login-btn{
    width:100%;padding:14px;background:linear-gradient(135deg,#5BC8E8,#0E5E80);
    color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:900;
    letter-spacing:3px;cursor:pointer;margin-top:8px;transition:transform .15s;
    box-shadow:0 8px 20px rgba(14,94,128,.35);
  }
  .login-btn:hover{transform:translateY(-2px)}
  .login-btn:disabled{background:#CFD8DD;cursor:not-allowed;box-shadow:none}
  .err{
    margin-top:10px;padding:9px 14px;background:#FFE0E0;color:#C2410C;
    border-radius:10px;font-size:12.5px;font-weight:700;display:none;
  }
  .err.show{display:block}
  .role-entry{display:grid;gap:8px;margin:18px 0 10px}
  .role-entry-btn{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px 14px;border:2px solid #DCEBF3;border-radius:14px;
    background:#F4FAFD;color:#1F3A4D;text-align:left;cursor:pointer;
    font-family:inherit;transition:border-color .15s,background .15s,transform .15s;
  }
  .role-entry-btn:hover{border-color:#7BB8DA;background:#fff}
  .role-entry-btn:active{transform:translateY(1px)}
  .role-entry-btn:focus-visible{outline:3px solid rgba(91,200,232,.35);outline-offset:2px}
  .role-entry-btn[aria-pressed="true"]{border-color:#0E5E80;background:#E0F2FF}
  .role-entry-name{font-size:14px;font-weight:900;letter-spacing:.5px;white-space:nowrap}
  .role-entry-desc{font-size:11px;color:#5C7A8C;font-weight:700;text-align:right}
  .entry-hint{font-size:11px;color:#5C7A8C;font-weight:700;margin-bottom:16px}
  .example-login{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-bottom:14px;padding:10px 12px;border-radius:12px;background:#EAF6FB;
    color:#365A6E;font-size:11px;font-weight:700;
  }
  .example-login code{color:#0E5E80;font-family:Consolas,monospace;font-weight:800}
  .example-fill{
    flex-shrink:0;padding:7px 10px;border:1.5px solid #5B9FBE;border-radius:9px;
    background:#fff;color:#0E5E80;font-family:inherit;font-size:11px;font-weight:800;
    cursor:pointer;
  }
  .example-fill:hover{background:#DDF1FA}
  .example-fill:active{transform:translateY(1px)}
  .example-fill:focus-visible{outline:3px solid rgba(91,200,232,.35);outline-offset:2px}
  #loginForm[hidden]{display:none}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-row">
    <div class="badge">🏝️</div>
    <div>
      <div class="title">宝山学习群岛</div>
      <div class="sub">Baoshan Learning Islands</div>
    </div>
  </div>

  <h1>登录</h1>
  <div class="greeting" id="campusGreeting">请选择身份入口，再输入对应账号密码</div>

  <div class="role-entry" role="group" aria-label="登录身份">
    <button class="role-entry-btn" type="button" data-entry="general_teacher" aria-pressed="false">
      <span class="role-entry-name">总务老师</span>
      <span class="role-entry-desc">全校选餐与社团管理</span>
    </button>
    <button class="role-entry-btn" type="button" data-entry="class_teacher" aria-pressed="false">
      <span class="role-entry-name">班主任老师</span>
      <span class="role-entry-desc">查看和管理本班学生</span>
    </button>
    <button class="role-entry-btn" type="button" data-entry="parent" aria-pressed="false">
      <span class="role-entry-name">学生家长</span>
      <span class="role-entry-desc">查看并操作自己的孩子</span>
    </button>
  </div>
  <div class="entry-hint" id="entryHint">请选择一个身份入口</div>

  <form id="loginForm" onsubmit="return doLogin(event)" hidden>
    <input id="loginEntry" type="hidden" name="entry">
    <div class="form-row">
      <label>账号</label>
      <input id="username" type="text" autocomplete="username" placeholder="请输入账号" required>
    </div>
    <div class="form-row">
      <label>密码</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••" required>
    </div>
    <button class="login-btn" id="submitBtn" type="submit">登 录</button>
    <div class="err" id="errBox"></div>
  </form>


<script>

const ENTRY_CONFIG = {
  general_teacher: { label: '总务老师' },
  class_teacher: { label: '班主任老师' },
  parent: { label: '学生家长' }
};
const CAMPUS_ID = new URLSearchParams(location.search).get('campus') || 'benbu';
const CAMPUS_NAMES = {benbu:'本部校区', baolin:'宝林校区'};
const LOCAL_API_BASE = (
  location.protocol === 'file:' ||
  (
    ['127.0.0.1', 'localhost'].includes(location.hostname) &&
    location.port !== '5051'
  )
) ? 'http://127.0.0.1:5051' : '';

// 每次从钉钉工作台进入都必须重新登录，清除旧版残留的老师/家长状态。
sessionStorage.clear();
document.getElementById('campusGreeting').textContent =
  `${CAMPUS_NAMES[CAMPUS_ID] || CAMPUS_ID} · 请选择身份入口，再输入对应账号密码`;

document.querySelectorAll('.role-entry-btn').forEach(button => {
  button.addEventListener('click', () => {
    const entry = button.dataset.entry;
    document.querySelectorAll('.role-entry-btn').forEach(item => {
      item.setAttribute('aria-pressed', String(item === button));
    });
    document.getElementById('loginEntry').value = entry;
    document.getElementById('entryHint').textContent = `当前入口：${ENTRY_CONFIG[entry].label}`;
    document.getElementById('loginForm').hidden = false;
    document.getElementById('username').focus();
  });
});


async function doLogin(e){
  e.preventDefault();
  const entry = document.getElementById('loginEntry').value;
  const u = document.getElementById('username').value.replace(/\u200B/g, '').trim();
  const p = document.getElementById('password').value;
  const err = document.getElementById('errBox');
  const btn = document.getElementById('submitBtn');
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = '登录中...';
  try {
    const r = await fetch(`${LOCAL_API_BASE}/api/login`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:u, password:p, entry, campus:CAMPUS_ID})
    });
    const data = await r.json();
    if(!r.ok || !data.success){
      err.textContent = data.error || '登录失败';
      err.classList.add('show');
      btn.disabled = false; btn.textContent = '登 录';
      return false;
    }
    // 把登录信息写入 sessionStorage（与 UserAuth 字段约定一致）
    const user = data.user;
    sessionStorage.clear();
    if(data.sessionToken) sessionStorage.setItem('bs_session_token', data.sessionToken);
    sessionStorage.setItem('bs_campus', user.campus || CAMPUS_ID);
    sessionStorage.setItem('bs_role', user.role);
    if(user.sub_role) sessionStorage.setItem('bs_sub_role', user.sub_role);
    if(user.bound_grade) sessionStorage.setItem('bs_bound_grade', user.bound_grade);
    if(user.bound_class) sessionStorage.setItem('bs_bound_class', user.bound_class);
    if(user.kid_name) sessionStorage.setItem('bs_kid_name', user.kid_name);
    if(user.boundIdCard) sessionStorage.setItem('bs_bound_id_card', user.boundIdCard);
    if(user.bound_id_card) sessionStorage.setItem('bs_bound_id_card', user.bound_id_card);
    if(user.demo_idx != null) sessionStorage.setItem('bs_bound_idx', String(user.demo_idx));
    if(user.displayName) sessionStorage.setItem('bs_user_nick', user.displayName);

    // 家长：把绑定学生的真实档案预拉一次，缓存到 sessionStorage
    if(user.role === 'parent'){
      try {
        const sr = await fetch(LOCAL_API_BASE + '/api/auth/me', {
          headers:{'Authorization':'Bearer ' + data.sessionToken}
        });
        if(sr.ok){
          const me = await sr.json();
          const stu = me.boundStudent;
          if(stu){
            sessionStorage.setItem('bs_bound_student_json', JSON.stringify(stu));
            sessionStorage.setItem('bs_bound_id_card', stu.idCard || '');
            sessionStorage.setItem('bs_bound_grade', stu.grade || '');
            sessionStorage.setItem('bs_bound_class', stu.class || '');
            sessionStorage.setItem('bs_kid_name', stu.displayName || user.kid_name || '');
          }
        }
      } catch(e){ /* 后端不可达时静默跳过，岛屿仍可走 fallback */ }
    }
    if(user.role === 'parent'){
      const childCode = sessionStorage.getItem('bs_bound_id_card') || user.bound_id_card || '';
      const params = new URLSearchParams({role:'parent', campus:user.campus || CAMPUS_ID});
      if(childCode) params.set('childCode', childCode);
      location.href = `/nutrition/recommendations.html?${params.toString()}#parentSelection`;
    } else {
      location.href = `island-homepage.html?campus=${encodeURIComponent(user.campus || CAMPUS_ID)}&auth=1`;
    }
    return false;
  } catch(ex){
    err.textContent = `网络错误：${ex.message}（接口：${LOCAL_API_BASE || location.origin}）`;
    err.classList.add('show');
    btn.disabled = false; btn.textContent = '登 录';
    return false;
  }
}

</script>
</body>
</html>
