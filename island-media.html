<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影音馆 · 宝山实验</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:'PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;color:#E0E0E0}
  body{
    background: linear-gradient(180deg,#1A1028 0%, #2D1B4E 30%, #1A237E 70%, #0D1B2A 100%);
    overflow-x:hidden;min-height:100vh;
  }

  .topbar{position:sticky;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:14px;padding:0 24px;z-index:50;background:rgba(20,10,35,0.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 2px 12px rgba(0,0,0,0.3);border-bottom:1px solid rgba(255,255,255,0.08)}
  .back-btn{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#7C4DFF,#448AFF);color:#fff;font-weight:800;font-size:14px;letter-spacing:1px;padding:8px 16px;border-radius:22px;border:none;cursor:pointer;box-shadow:0 4px 10px rgba(124,77,255,0.35);transition:transform .15s}
  .back-btn:hover{transform:translateY(-2px)}
  .crumbs{display:flex;align-items:center;gap:8px;color:#B0BEC5;font-weight:700;font-size:15px;letter-spacing:1px}
  .crumbs .arrow{color:#7C4DFF}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .student-pill{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 6px;border-radius:30px;background:rgba(255,255,255,0.1);box-shadow:0 3px 10px rgba(0,0,0,0.2);color:#E0E0E0}
  .stu-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#7C4DFF,#448AFF);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
  .stu-info .name{font-weight:800;font-size:14px;color:#E0E0E0}
  .stu-info .meta{font-size:11px;color:#7C4DFF;letter-spacing:.5px}

  .banner{position:relative;height:200px;overflow:hidden;background: linear-gradient(135deg,#2D1B4E,#1A237E);border-bottom:4px solid #7C4DFF}
  .banner-text{position:absolute;left:32px;top:50%;transform:translateY(-50%);z-index:5}
  .banner-text h1{font-size:36px;font-weight:900;color:#E0E0E0;letter-spacing:6px;text-shadow:0 3px 0 #7C4DFF}
  .banner-text p{margin-top:6px;color:#B0BEC5;font-weight:700;font-size:14px;letter-spacing:2px}
  .banner-text .tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.1);color:#B39DDB;font-weight:800;font-size:12px;padding:4px 12px;border-radius:14px;margin-top:10px}
  .banner-text .tag .dot{width:8px;height:8px;border-radius:50%;background:#7C4DFF;box-shadow:0 0 0 3px rgba(124,77,255,.25)}

  .wrap{max-width:1280px;margin:0 auto;padding:24px 24px 80px}

  /* 筛选 */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;justify-content:center}
  .filter-btn{padding:10px 18px;border-radius:14px;background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.12);color:#B0BEC5;font-weight:800;font-size:13px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
  .filter-btn:hover{background:rgba(124,77,255,0.2);border-color:#7C4DFF;color:#E0E0E0}
  .filter-btn.active{background:linear-gradient(135deg,#7C4DFF,#448AFF);color:#fff;border-color:#7C4DFF;box-shadow:0 4px 12px rgba(124,77,255,.3)}

  /* 上传按钮 */
  .upload-btn{
    padding:10px 20px;border-radius:14px;
    background:linear-gradient(135deg,#448AFF,#2962FF);color:#fff;
    font-weight:800;font-size:13px;letter-spacing:1px;border:none;cursor:pointer;
    box-shadow:0 4px 12px rgba(68,138,255,.3);transition:transform .15s;
  }
  .upload-btn:hover{transform:translateY(-2px)}

  /* 网格 */
  .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  @media (max-width:768px){.media-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}}
  .media-card{
    background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);
    border-radius:18px;overflow:hidden;cursor:pointer;transition:all .25s;
  }
  .media-card:hover{transform:translateY(-6px);border-color:#7C4DFF;box-shadow:0 12px 30px rgba(124,77,255,.25)}
  .media-card .thumb{
    width:100%;aspect-ratio:16/10;object-fit:cover;display:block;
    background:linear-gradient(135deg,#1A237E,#311B92);
  }
  .media-card .thumb.audio-thumb{
    display:flex;align-items:center;justify-content:center;
    font-size:48px;background:linear-gradient(135deg,#4A148C,#7B1FA2);
  }
  .media-card .card-info{padding:14px}
  .media-card .title{font-size:14px;font-weight:800;color:#E0E0E0;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .media-card .author{font-size:11px;color:#7C4DFF;font-weight:600;margin-top:4px}
  .media-card .stats{display:flex;gap:12px;margin-top:8px;font-size:11px;color:#B0BEC5;font-weight:700}
  .media-card .stats span{display:inline-flex;align-items:center;gap:3px}

  /* 详情弹窗 */
  .veil{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
  .veil.show{display:flex}
  .detail-modal{
    background:linear-gradient(180deg,#1A1028,#2D1B4E);border-radius:24px;
    width:800px;max-width:100%;max-height:90vh;overflow-y:auto;
    box-shadow:0 24px 60px rgba(0,0,0,0.6);animation:popIn .35s cubic-bezier(.34,1.56,.64,1);
    border:2px solid rgba(124,77,255,.3);
  }
  @keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .detail-header{position:relative}
  .detail-header .close{position:absolute;top:14px;right:14px;z-index:5;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .detail-header .player-area{
    width:100%;aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center;
  }
  .detail-header .player-area audio,.detail-header .player-area video{width:100%;max-height:100%}
  .detail-header .player-area .audio-placeholder{
    text-align:center;padding:40px;
  }
  .detail-header .player-area .audio-placeholder .e{font-size:80px;line-height:1}
  .detail-header .player-area .audio-placeholder .t{font-size:16px;color:#B0BEC5;font-weight:800;margin-top:10px}
  .detail-body{padding:20px}
  .detail-body .d-title{font-size:20px;font-weight:900;color:#E0E0E0;letter-spacing:1px}
  .detail-body .d-meta{font-size:12px;color:#7C4DFF;font-weight:700;margin-top:6px}
  .detail-body .d-desc{font-size:13px;color:#B0BEC5;line-height:1.7;margin-top:14px}
  .detail-body .d-actions{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.08)}
  .action-btn{
    padding:8px 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.06);color:#B0BEC5;font-weight:800;font-size:12px;
    cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px;
  }
  .action-btn:hover{background:rgba(124,77,255,0.2);border-color:#7C4DFF;color:#E0E0E0}
  .action-btn.liked{background:rgba(244,67,54,0.25);border-color:#F44336;color:#EF5350}
  /* 评论区 */
  .comment-section{margin-top:18px}
  .comment-section h4{font-size:15px;font-weight:800;color:#E0E0E0;letter-spacing:1px;margin-bottom:12px}
  .comment-input-row{display:flex;gap:8px;margin-bottom:14px}
  .comment-input-row input{flex:1;padding:10px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#E0E0E0;font-size:13px;font-family:inherit;outline:none}
  .comment-input-row input:focus{border-color:#7C4DFF}
  .comment-input-row button{padding:10px 16px;border-radius:12px;background:linear-gradient(135deg,#7C4DFF,#448AFF);color:#fff;font-weight:800;font-size:12px;border:none;cursor:pointer;letter-spacing:1px}
  .comment-list{max-height:200px;overflow-y:auto}
  .comment-item{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.04);margin-bottom:8px}
  .comment-item .c-author{font-size:11px;font-weight:800;color:#7C4DFF}
  .comment-item .c-text{font-size:12px;color:#B0BEC5;margin-top:3px}
  .comment-item .c-time{font-size:9px;color:#616161;margin-top:2px}

  /* 上传弹窗 */
  .upload-veil{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:250;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
  .upload-veil.show{display:flex}
  .upload-modal{
    background:linear-gradient(180deg,#1A1028,#2D1B4E);border-radius:20px;
    width:520px;max-width:100%;padding:26px;border:2px solid rgba(124,77,255,.3);
    box-shadow:0 24px 60px rgba(0,0,0,0.6);animation:popIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  .upload-modal h3{font-size:20px;font-weight:900;color:#E0E0E0;letter-spacing:2px;margin-bottom:8px}
  .upload-modal .drop-area{margin-top:14px;border:2px dashed rgba(124,77,255,.4);border-radius:14px;padding:30px 20px;text-align:center;background:rgba(255,255,255,0.03);cursor:pointer;transition:all .2s}
  .upload-modal .drop-area:hover{background:rgba(124,77,255,0.1);border-color:#7C4DFF}
  .upload-modal .drop-area .e{font-size:42px;margin-bottom:8px}
  .upload-modal .drop-area .t{font-size:14px;font-weight:800;color:#B0BEC5;letter-spacing:1px}
  .upload-modal .drop-area .s{font-size:11.5px;color:#616161;margin-top:4px}
  .upload-modal .field{margin-top:14px}
  .upload-modal .field label{display:block;font-size:12px;font-weight:800;color:#B0BEC5;margin-bottom:4px;letter-spacing:1px}
  .upload-modal .field input,.upload-modal .field textarea{
    width:100%;padding:10px 12px;border:1.5px solid rgba(255,255,255,0.15);border-radius:10px;
    background:rgba(255,255,255,0.06);color:#E0E0E0;font-size:13px;font-family:inherit;outline:none;
  }
  .upload-modal .field input:focus,.upload-modal .field textarea:focus{border-color:#7C4DFF}
  .upload-modal .field textarea{resize:vertical;min-height:60px}
  .upload-modal .btns{margin-top:18px;display:flex;gap:10px;justify-content:flex-end}
  .upload-modal .btns button{font-family:inherit;font-weight:800;font-size:13px;padding:10px 18px;border-radius:14px;cursor:pointer;border:none;letter-spacing:.5px}
  .upload-modal .btns .cancel{background:rgba(255,255,255,0.08);color:#B0BEC5;border:1.5px solid rgba(255,255,255,0.15)}
  .upload-modal .btns .confirm{background:linear-gradient(135deg,#7C4DFF,#448AFF);color:#fff;box-shadow:0 4px 10px rgba(124,77,255,.35)}
  .upload-modal .btns .confirm:disabled{opacity:.5;cursor:not-allowed}

  .toast{position:fixed;left:50%;top:80px;transform:translateX(-50%) translateY(-30px);background:#7C4DFF;color:#fff;padding:12px 22px;border-radius:24px;font-weight:800;font-size:14px;letter-spacing:1px;box-shadow:0 10px 26px rgba(124,77,255,.35);opacity:0;transition:all .35s;z-index:300}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .empty-state{text-align:center;padding:60px 20px;color:#616161}
  .empty-state .e{font-size:64px;line-height:1}
  .empty-state .t{font-size:16px;font-weight:800;margin-top:12px}
</style>
<script>window.BS_DINGTALK_CORP_ID = '__INJECT_CORP_ID__';</script>
<script src="https://g.alicdn.com/dingding/dingtalk-jsapi/2.13.42/dingtalk.open.js"></script>
<script src="assets/dingtalk-bootstrap.js"></script>

</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="goHome()">⛵ 回首页</button>
  <div class="crumbs">
    <span>快乐学习群岛</span><span class="arrow">›</span><span>💜 审美岛 · 影音馆</span>
  </div>
  <div class="topbar-right">
    <button class="upload-btn" onclick="openUpload()">📤 上传作品</button>
    <div class="student-pill">
      <div class="stu-avatar" id="stuAvatar">林</div>
      <div class="stu-info">
        <div class="name" id="stuName">林**</div>
        <div class="meta" id="stuMeta">小学 · 五年级 1 班</div>
      </div>
    </div>
    <button onclick="if(confirm('退出登录?')){window.UserAuth&&UserAuth.signOut()}" style="padding:6px 12px;border-radius:14px;border:1.5px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#B0BEC5;font-weight:800;font-size:11.5px;cursor:pointer;font-family:inherit" title="退出登录">退出</button>
  </div>
</div>

<div class="banner">
  <div class="banner-text">
    <h1>🎬 影音馆</h1>
    <p>欣赏同学们的创作 · 分享你的精彩</p>
    <span class="tag"><span class="dot"></span>视频 · 音频 · 创作分享</span>
  </div>
</div>

<div class="wrap">
  <div class="filters">
    <button class="filter-btn active" onclick="switchFilter('all')">🌟 全部</button>
    <button class="filter-btn" onclick="switchFilter('video')">🎬 视频</button>
    <button class="filter-btn" onclick="switchFilter('audio')">🎵 音频</button>
  </div>

  <div class="media-grid" id="mediaGrid">
    <div class="empty-state" style="grid-column:1/-1">
      <div class="e">📡</div>
      <div class="t">加载中…</div>
    </div>
  </div>
</div>

<!-- 上传弹窗 -->
<div class="upload-veil" id="uploadVeil">
  <div class="upload-modal">
    <h3>📤 上传作品</h3>
    <div class="drop-area" id="mDropArea" onclick="document.getElementById('mFileInput').click()">
      <div class="e">🎬</div>
      <div class="t">点击选择视频/音频文件</div>
      <div class="s" id="mFileName">支持 MP4 / MP3 / WebM</div>
    </div>
    <input type="file" id="mFileInput" accept="video/*,audio/*" style="display:none" onchange="handleMediaPick(event)">
    <div class="field">
      <label>作品标题</label>
      <input id="mTitle" placeholder="给你的作品取个名字…">
    </div>
    <div class="field">
      <label>作品简介</label>
      <textarea id="mDesc" placeholder="简单介绍一下你的作品…"></textarea>
    </div>
    <div class="btns">
      <button class="cancel" onclick="closeUpload()">取消</button>
      <button class="confirm" id="mSubmitBtn" onclick="submitMedia()" disabled>开始上传</button>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="veil" id="detailVeil">
  <div class="detail-modal">
    <div class="detail-header">
      <button class="close" onclick="closeDetail()">✕</button>
      <div class="player-area" id="playerArea"></div>
    </div>
    <div class="detail-body">
      <div class="d-title" id="dTitle"></div>
      <div class="d-meta" id="dMeta"></div>
      <div class="d-desc" id="dDesc"></div>
      <div class="d-actions">
        <button class="action-btn" id="likeBtn" onclick="toggleLike()">
          ❤️ <span id="likeCount">0</span>
        </button>
      </div>
      <div class="comment-section">
        <h4>💬 评论 (<span id="commentCount">0</span>)</h4>
        <div class="comment-input-row">
          <input id="commentInput" placeholder="写一条评论…" onkeydown="if(event.key==='Enter')submitComment()">
          <button onclick="submitComment()">发送</button>
        </div>
        <div class="comment-list" id="commentList"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ 工具 ============
function getToken(){ return (window.UserAuth&&UserAuth.getToken)?UserAuth.getToken():sessionStorage.getItem('bs_session_token')||''; }
function getIdCard(){
  if(window.UserAuth&&UserAuth.getIdCard) return UserAuth.getIdCard();
  if(window.UserAuth&&UserAuth.getCurrentIdCard) return UserAuth.getCurrentIdCard();
  return 'demo_001';
}
async function api(path, opts={}){
  const token = getToken();
  const headers = opts.headers||{};
  if(token) headers['Authorization'] = 'Bearer '+token;
  const res = await fetch(location.origin+path,{...opts,headers});
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
function goHome(){ location.href='island-homepage.html'; }
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

// ============ 筛选 ============
let currentFilter = 'all';
let allWorks = [];

function switchFilter(type){
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent.includes(type==='all'?'全部':type==='video'?'视频':'音频'));
  });
  renderGrid();
}

async function loadWorks(){
  try{
    const q = currentFilter!=='all' ? '?type='+currentFilter : '';
    const data = await api('/api/media-works'+q);
    allWorks = data.works||data.rows||data||[];
    if(!Array.isArray(allWorks)) allWorks=[];
    renderGrid();
  }catch(e){
    document.getElementById('mediaGrid').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="e">😢</div>
        <div class="t">加载失败：${e.message}</div>
      </div>`;
  }
}

function renderGrid(){
  const grid = document.getElementById('mediaGrid');
  const filtered = currentFilter==='all'?allWorks:allWorks.filter(w=>(w.type||w.media_type||'')===currentFilter);
  if(!filtered.length){
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="e">🎬</div>
        <div class="t">暂无作品</div>
        <div style="color:#616161;font-size:13px;margin-top:6px">点击右上角「上传作品」来分享第一个！</div>
      </div>`;
    return;
  }
  grid.innerHTML = filtered.map((w,i)=>{
    const type = w.type||w.media_type||'video';
    const url = w.url||w.file_url||w.path||'';
    const thumb = w.thumbnail||w.thumb||w.cover||'';
    if(type==='audio'){
      return `
      <div class="media-card" onclick="openDetail(${i},'${type}')">
        <div class="thumb audio-thumb">🎵</div>
        <div class="card-info">
          <div class="title">${w.title||w.name||'未命名'}</div>
          <div class="author">👤 ${w.author||w.author_name||'同学'}</div>
          <div class="stats">
            <span>❤️ ${w.likes||0}</span>
            <span>💬 ${w.comments||0}</span>
          </div>
        </div>
      </div>`;
    }
    return `
    <div class="media-card" onclick="openDetail(${i},'${type}')">
      ${thumb?`<img class="thumb" src="${thumb}" alt="${w.title}" loading="lazy">`:`<div class="thumb audio-thumb">🎬</div>`}
      <div class="card-info">
        <div class="title">${w.title||w.name||'未命名'}</div>
        <div class="author">👤 ${w.author||w.author_name||'同学'}</div>
        <div class="stats">
          <span>❤️ ${w.likes||0}</span>
          <span>💬 ${w.comment_count||w.comments||0}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ============ 详情 ============
let detailWork = null;
function openDetail(idx, type){
  const filtered = currentFilter==='all'?allWorks:allWorks.filter(w=>(w.type||w.media_type||'')===currentFilter);
  detailWork = filtered[idx];
  if(!detailWork) return;
  const url = detailWork.url||detailWork.file_url||detailWork.path||'';
  document.getElementById('dTitle').textContent = detailWork.title||detailWork.name||'未命名';
  document.getElementById('dMeta').textContent = '👤 '+(detailWork.author||detailWork.author_name||'同学')+' · '+(detailWork.created_at||'').slice(0,10);
  document.getElementById('dDesc').textContent = detailWork.description||detailWork.desc||'暂无简介';
  document.getElementById('likeCount').textContent = detailWork.likes||0;
  document.getElementById('commentCount').textContent = (detailWork.comment_count||detailWork.comments||0);
  const likeBtn = document.getElementById('likeBtn');
  likeBtn.classList.toggle('liked', !!detailWork.liked_by_me);
  document.getElementById('commentInput').value = '';
  loadComments();

  const player = document.getElementById('playerArea');
  const t = detailWork.type||detailWork.media_type||'video';
  if(t==='audio' && url){
    player.innerHTML = `<div class="audio-placeholder"><div class="e">🎵</div><div class="t">${detailWork.title||'音频'}</div><audio controls autoplay style="width:100%;margin-top:10px"><source src="${url}">您的浏览器不支持音频播放</audio></div>`;
  }else if(url){
    player.innerHTML = `<video controls autoplay style="width:100%;max-height:100%" poster="${detailWork.thumbnail||''}"><source src="${url}">您的浏览器不支持视频播放</video>`;
  }else{
    player.innerHTML = `<div class="audio-placeholder"><div class="e">🎬</div><div class="t">暂无播放资源</div></div>`;
  }
  document.getElementById('detailVeil').classList.add('show');
  document.body.style.overflow='hidden';
}

function closeDetail(){
  document.getElementById('detailVeil').classList.remove('show');
  document.body.style.overflow='';
  detailWork = null;
}

// ============ 点赞 ============
async function toggleLike(){
  if(!detailWork) return;
  const id = detailWork.id||detailWork.work_id;
  if(!id) return;
  try{
    await api('/api/media-like',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ work_id: id, id_card: getIdCard() })
    });
    detailWork.liked_by_me = !detailWork.liked_by_me;
    detailWork.likes = (detailWork.likes||0)+(detailWork.liked_by_me?1:-1);
    document.getElementById('likeCount').textContent = Math.max(0,detailWork.likes);
    const likeBtn = document.getElementById('likeBtn');
    likeBtn.classList.toggle('liked', !!detailWork.liked_by_me);
    loadWorks();
  }catch(e){ showToast('操作失败'); }
}

// ============ 评论 ============
async function submitComment(){
  if(!detailWork) return;
  const text = document.getElementById('commentInput').value.trim();
  if(!text){ showToast('请输入评论内容'); return; }
  const id = detailWork.id||detailWork.work_id;
  if(!id) return;
  try{
    await api('/api/media-comment',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ work_id: id, id_card: getIdCard(), content: text })
    });
    document.getElementById('commentInput').value = '';
    detailWork.comment_count = (detailWork.comment_count||detailWork.comments||0)+1;
    document.getElementById('commentCount').textContent = detailWork.comment_count;
    loadComments();
  }catch(e){ showToast('评论失败：'+e.message); }
}

async function loadComments(){
  const list = document.getElementById('commentList');
  if(!detailWork) return;
  const id = detailWork.id||detailWork.work_id;
  if(!id){ list.innerHTML=''; return; }
  try{
    const data = await api('/api/media-comment?work_id='+id);
    const comments = data.comments||data||[];
    if(!Array.isArray(comments)||!comments.length){ list.innerHTML='<div style="font-size:12px;color:#616161;padding:10px">暂无评论，来写第一条吧 ✨</div>'; return; }
    list.innerHTML = comments.map(c=>`
      <div class="comment-item">
        <div class="c-author">${c.author||c.author_name||'同学'}${c.is_owner?' · 作者':''}</div>
        <div class="c-text">${c.content||c.text||''}</div>
        <div class="c-time">${(c.created_at||'').slice(0,16)}</div>
      </div>
    `).join('');
  }catch(e){ list.innerHTML=''; }
}

// ============ 上传 ============
let mediaFile = null;
function openUpload(){ document.getElementById('uploadVeil').classList.add('show'); document.body.style.overflow='hidden'; }
function closeUpload(){ document.getElementById('uploadVeil').classList.remove('show'); document.body.style.overflow=''; mediaFile=null; document.getElementById('mFileName').textContent='支持 MP4 / MP3 / WebM'; document.getElementById('mSubmitBtn').disabled=true; }
function handleMediaPick(e){
  const f = e.target.files[0];
  if(!f) return;
  mediaFile = f;
  document.getElementById('mFileName').textContent = '已选：'+f.name+' ('+(f.size/1024).toFixed(0)+' KB)';
  document.getElementById('mSubmitBtn').disabled = false;
}
async function submitMedia(){
  if(!mediaFile){ showToast('请先选择文件'); return; }
  const title = document.getElementById('mTitle').value.trim();
  if(!title){ showToast('请输入作品标题'); return; }
  const btn = document.getElementById('mSubmitBtn');
  btn.disabled=true; btn.textContent='上传中…';
  const formData = new FormData();
  formData.append('file', mediaFile);
  formData.append('title', title);
  formData.append('description', document.getElementById('mDesc').value.trim());
  formData.append('id_card', getIdCard());
  try{
    const token = getToken();
    const headers = {};
    if(token) headers['Authorization'] = 'Bearer '+token;
    const res = await fetch(location.origin+'/api/media-works/upload', {method:'POST',headers,body:formData});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    showToast('✅ 上传成功！');
    closeUpload();
    document.getElementById('mTitle').value='';document.getElementById('mDesc').value='';
    await loadWorks();
  }catch(e){ showToast('上传失败：'+e.message); btn.disabled=false; btn.textContent='开始上传'; }
}

// 拖放上传
(function(){
  const drop = document.getElementById('mDropArea');
  if(!drop) return;
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.background='rgba(124,77,255,0.2)';}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,()=>{drop.style.background='';}));
  drop.addEventListener('drop',e=>{
    e.preventDefault();
    const f = e.dataTransfer.files&&e.dataTransfer.files[0];
    if(!f) return;
    mediaFile = f;
    document.getElementById('mFileName').textContent='已选：'+f.name+' ('+(f.size/1024).toFixed(0)+' KB)';
    document.getElementById('mSubmitBtn').disabled=false;
  });
})();

// ============ 初始化 ============
(function init(){
  loadWorks();
  if(window.UserAuth){ UserAuth.ready(()=>{
    const info = UserAuth.getCurrentStudentInfo&&UserAuth.getCurrentStudentInfo();
    if(!info) return;
    document.getElementById('stuAvatar').textContent=(info.displayName||'生').charAt(0);
    document.getElementById('stuName').textContent=info.displayName||'***';
    document.getElementById('stuMeta').textContent=(info.grade||'')+' · '+(info.class||'');
  });}
})();
</script>
