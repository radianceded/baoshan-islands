<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成长岛 · 宝山实验</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:'PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;color:#1F3A4D}
  body{
    background: linear-gradient(180deg,#FFF8E1 0%, #FFE082 20%, #FFD54F 50%, #FFB300 100%);
    overflow-x:hidden;min-height:100vh;
  }

  .topbar{position:sticky;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:14px;padding:0 24px;z-index:50;background:rgba(255,255,255,0.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 2px 12px rgba(0,80,120,0.1)}
  .back-btn{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#FFD54F,#FFB300);color:#3D2812;font-weight:800;font-size:14px;letter-spacing:1px;padding:8px 16px;border-radius:22px;border:none;cursor:pointer;box-shadow:0 4px 10px rgba(255,179,0,0.35);transition:transform .15s}
  .back-btn:hover{transform:translateY(-2px)}
  .crumbs{display:flex;align-items:center;gap:8px;color:#3D2812;font-weight:700;font-size:15px;letter-spacing:1px}
  .crumbs .arrow{color:#B8860B}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .student-pill{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 6px;border-radius:30px;background:#fff;box-shadow:0 3px 10px rgba(0,80,120,0.12)}
  .stu-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#FFB300,#FF8F00);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
  .stu-info .name{font-weight:800;font-size:14px;color:#1F3A4D}
  .stu-info .meta{font-size:11px;color:#7BB8DA;letter-spacing:.5px}

  .banner{position:relative;height:280px;overflow:hidden;background: linear-gradient(135deg,#FFF8E1,#FFD54F);border-bottom:4px solid #FFB300}
  .banner-text{position:absolute;left:32px;top:50%;transform:translateY(-50%);z-index:5}
  .banner-text h1{font-size:36px;font-weight:900;color:#3D2812;letter-spacing:6px;text-shadow:0 3px 0 #fff}
  .banner-text p{margin-top:6px;color:#7A4F1B;font-weight:700;font-size:14px;letter-spacing:2px}
  .banner-text .tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);color:#B8860B;font-weight:800;font-size:12px;padding:4px 12px;border-radius:14px;margin-top:10px}
  .banner-text .tag .dot{width:8px;height:8px;border-radius:50%;background:#FFB300;box-shadow:0 0 0 3px rgba(255,179,0,.25)}

  .wrap{max-width:1280px;margin:0 auto;padding:24px 24px 80px}

  /* Tab 切换 */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;justify-content:center}
  .tab{padding:10px 18px;border-radius:14px;background:#fff;border:2px solid #FFE082;color:#7A4F1B;font-weight:800;font-size:13px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 10px rgba(0,0,0,0.06)}
  .tab:hover{transform:translateY(-2px);border-color:#FFB300}
  .tab.active{background:linear-gradient(135deg,#FFD54F,#FFB300);color:#3D2812;border-color:#FF8F00;box-shadow:0 6px 14px rgba(255,179,0,.4)}

  /* 高光时刻 Hero */
  .hero-card{background:linear-gradient(135deg,#FFFDE7,#FFE082);border:3px solid #FFB300;border-radius:24px;padding:24px;margin-bottom:20px;box-shadow:0 10px 30px rgba(200,150,0,0.15);position:relative;overflow:hidden}
  .hero-card::before{content:'';position:absolute;top:-50px;right:-50px;width:150px;height:150px;background:radial-gradient(circle,rgba(255,215,0,.3),transparent 70%);border-radius:50%}
  .hero-h{text-align:center;margin-bottom:16px}
  .hero-h h2{font-size:22px;font-weight:900;color:#3D2812;letter-spacing:2px}
  .hero-h p{font-size:12px;color:#7A4F1B;margin-top:4px;font-weight:700;letter-spacing:1px}
  .hero-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media (max-width:900px){.hero-grid{grid-template-columns:repeat(2,1fr)}}
  .hero-item{
    background:#fff;border:2px solid #FFD54F;border-radius:18px;padding:16px;text-align:center;
    cursor:pointer;transition:all .2s;position:relative;
  }
  .hero-item:hover{transform:translateY(-4px);border-color:#FFB300;box-shadow:0 8px 18px rgba(200,150,0,.25)}
  .hero-item .badge{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px}
  .hero-item .badge.gold{background:#FFD54F;color:#7A4F1B}
  .hero-item .badge.silver{background:#E0E0E0;color:#616161}
  .hero-item .badge.bronze{background:#FFCC80;color:#5D4037}
  .hero-item .badge.special{background:linear-gradient(135deg,#E1BEE7,#CE93D8);color:#4A148C}
  .hero-item .trophy{font-size:42px;line-height:1;margin-bottom:6px}
  .hero-item .nm{font-size:14px;font-weight:900;color:#1F3A4D;letter-spacing:.5px}
  .hero-item .from{font-size:10px;color:#7BB8DA;font-weight:600;margin-top:4px}

  /* 奖状卡片网格 */
  .card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 30px rgba(0,80,120,0.08);border:1px solid rgba(255,211,80,0.4);margin-bottom:20px}
  .card-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .card-h .icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .card-h .icon.gold{background:linear-gradient(135deg,#FFE082,#FFB300)}
  .card-h h2{font-size:20px;font-weight:900;letter-spacing:2px;color:#1F3A4D}
  .card-h .sub{margin-left:auto;font-size:12px;color:#7BB8DA;font-weight:700;letter-spacing:1px}

  /* 待领取 / 已获得 列表 */
  .award-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  @media (max-width:768px){.award-grid{grid-template-columns:1fr}}
  .award-card{
    background:#fff;border:2px solid #FFE082;border-radius:18px;padding:18px;
    display:flex;gap:14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;
  }
  .award-card:hover{transform:translateY(-3px);border-color:#FFB300;box-shadow:0 8px 18px rgba(200,150,0,.25)}
  .award-card .seal{
    width:60px;height:60px;flex-shrink:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:30px;
    background:linear-gradient(135deg,#FFF8E1,#FFE082);border:3px solid #FFB300;
  }
  .award-card .info{flex:1;min-width:0}
  .award-card .nm{font-size:14px;font-weight:900;color:#1F3A4D;letter-spacing:.5px;line-height:1.3}
  .award-card .level{font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;margin-top:4px;display:inline-block}
  .award-card .level.national{background:#FFCDD2;color:#C62828}
  .award-card .level.city{background:#FFE0B2;color:#E65100}
  .award-card .level.district{background:#C8E6C9;color:#2E7D32}
  .award-card .level.school{background:#BBDEFB;color:#1565C0}
  .award-card .from{font-size:11px;color:#7BB8DA;font-weight:600;margin-top:4px}
  .award-card .date{font-size:10px;color:#9FB8C5;margin-top:2px}
  .award-card .actions{display:flex;gap:6px;margin-top:10px}
  .claim-btn{
    padding:8px 16px;border-radius:14px;font-weight:800;font-size:12px;letter-spacing:1px;
    border:none;cursor:pointer;transition:transform .15s;
  }
  .claim-btn.claim{background:linear-gradient(135deg,#FFD54F,#FFB300);color:#3D2812;box-shadow:0 3px 8px rgba(255,179,0,.3)}
  .claim-btn.claim:hover{transform:translateY(-2px)}
  .claim-btn.speech{background:linear-gradient(135deg,#E1BEE7,#AB47BC);color:#fff;box-shadow:0 3px 8px rgba(171,71,188,.3)}
  .claim-btn.speech:hover{transform:translateY(-2px)}
  .claim-btn.claimed{background:#E8F5E9;color:#2E7D32;border:1.5px solid #A5D6A7;cursor:default;font-size:11px}

  /* 时间线 */
  .timeline{position:relative;padding-left:32px}
  .timeline::before{content:'';position:absolute;left:14px;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#FFD54F,#FFB300,#FF9800)}
  .tl-item{position:relative;margin-bottom:18px}
  .tl-item::before{
    content:'';position:absolute;left:-24px;top:8px;width:12px;height:12px;
    border-radius:50%;background:#FFB300;border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.15);
  }
  .tl-item .award-card{margin-bottom:0}

  /* 自传奖状上传 */
  .upload-form{background:linear-gradient(135deg,#FFF8E1,#FFECB3);border:2px dashed #FFB300;border-radius:18px;padding:20px;text-align:center}
  .upload-form .drop-area{padding:30px;cursor:pointer;border-radius:14px;transition:background .2s}
  .upload-form .drop-area:hover{background:rgba(255,179,0,.1)}
  .upload-form .drop-area .e{font-size:48px;line-height:1}
  .upload-form .drop-area .t{font-size:14px;font-weight:800;color:#3D2812;margin-top:8px}
  .upload-form .drop-area .s{font-size:11px;color:#7A4F1B;margin-top:4px}
  .upload-form .fields{margin-top:14px;text-align:left}
  .upload-form .field{margin-bottom:10px}
  .upload-form .field label{display:block;font-size:12px;font-weight:800;color:#3D2812;margin-bottom:4px;letter-spacing:1px}
  .upload-form .field input,.upload-form .field select{
    width:100%;padding:10px 12px;border:1.5px solid #FFE082;border-radius:10px;
    font-size:13px;font-family:inherit;color:#1F3A4D;outline:none;background:#fff;
  }
  .upload-form .field input:focus{border-color:#FFB300}
  .submit-btn{
    width:100%;padding:12px;background:linear-gradient(135deg,#FFB300,#FF8F00);color:#fff;
    font-weight:900;font-size:15px;letter-spacing:2px;border:none;border-radius:14px;
    cursor:pointer;box-shadow:0 4px 12px rgba(255,143,0,.3);transition:transform .15s;
  }
  .submit-btn:hover{transform:translateY(-2px)}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed}

  /* 弹窗 */
  .veil{position:fixed;inset:0;background:rgba(0,30,60,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
  .veil.show{display:flex}
  .modal{background:#fff;border-radius:24px;width:520px;max-width:100%;padding:24px;box-shadow:0 24px 60px rgba(0,30,60,.3);max-height:85vh;overflow-y:auto;animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
  @keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h3{font-size:20px;font-weight:900;color:#1F3A4D;letter-spacing:2px;margin-bottom:14px}
  .modal .close-btn{float:right;background:none;border:none;font-size:24px;cursor:pointer;color:#7BB8DA}

  /* Confetti */
  .confetti-container{position:fixed;inset:0;pointer-events:none;z-index:500}
  .confetti{position:absolute;width:10px;height:10px;animation:confettiFall 2s ease-out forwards}
  @keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

  .toast{position:fixed;left:50%;top:80px;transform:translateX(-50%) translateY(-30px);background:#FF8F00;color:#fff;padding:12px 22px;border-radius:24px;font-weight:800;font-size:14px;letter-spacing:1px;box-shadow:0 10px 26px rgba(255,143,0,.35);opacity:0;transition:all .35s;z-index:300}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<script>window.BS_DINGTALK_CORP_ID = '__INJECT_CORP_ID__';</script>
<script src="https://g.alicdn.com/dingding/dingtalk-jsapi/2.13.42/dingtalk.open.js"></script>

<body>

<div class="topbar">
  <button class="back-btn" onclick="goHome()">⛵ 回首页</button>
  <div class="crumbs">
    <span>宝小学生画像</span><span class="arrow">›</span><span>🩷 成长岛</span>
  </div>
  <div class="topbar-right">
    <div class="student-pill">
      <div class="stu-avatar" id="stuAvatar">林</div>
      <div class="stu-info">
        <div class="name" id="stuName">林**</div>
        <div class="meta" id="stuMeta">小学 · 五年级 1 班</div>
      </div>
    </div>
    <button onclick="if(confirm('退出登录?')){window.UserAuth&&UserAuth.signOut()}" style="padding:6px 12px;border-radius:14px;border:1.5px solid #DCEBF3;background:#fff;color:#5C7A8C;font-weight:800;font-size:11.5px;cursor:pointer;font-family:inherit" title="退出登录">退出</button>
  </div>
</div>

<div class="banner">
  <div class="banner-text">
    <h1>🩷 成长岛</h1>
    <p>领取属于你的荣誉奖状 · 记录成长每一步</p>
    <span class="tag"><span class="dot"></span>你的成长 · 你的荣耀</span>
  </div>
</div>

<div class="wrap">
  <!-- 高光时刻 -->
  <div class="hero-card" id="heroSection">
    <div class="hero-h">
      <h2>🌟 高光时刻</h2>
      <p>AI 为你精选的 4 个最重要荣誉</p>
    </div>
    <div class="hero-grid" id="heroGrid">
      <div class="hero-item" style="grid-column:1/-1;background:transparent;border-style:dashed;color:#7BB8DA;padding:30px">
        点击 ✨ 按钮加载高光时刻
      </div>
    </div>
  </div>

  <!-- Tab 切换 -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('pending')">🎖️ 待领取</button>
    <button class="tab" onclick="switchTab('claimed')">🏆 已获得</button>
    <button class="tab" onclick="switchTab('self_report')">📤 自传奖状</button>
  </div>

  <!-- 待领取 -->
  <div id="tabPending">
    <div class="card">
      <div class="card-h">
        <div class="icon gold">🎖️</div>
        <h2>待领取奖状</h2>
        <div class="sub" id="pendingCount">0 项</div>
      </div>
      <div class="award-grid" id="pendingGrid">
        <div style="padding:30px;text-align:center;color:#7BB8DA;font-weight:700;grid-column:1/-1">加载中…</div>
      </div>
    </div>
  </div>

  <!-- 已获得 -->
  <div id="tabClaimed" style="display:none">
    <div class="card">
      <div class="card-h">
        <div class="icon gold">🏆</div>
        <h2>已获得奖状</h2>
        <div class="sub" id="claimedCount">0 项</div>
      </div>
      <div class="timeline" id="claimedTimeline">
        <div style="padding:30px;text-align:center;color:#7BB8DA;font-weight:700">加载中…</div>
      </div>
    </div>
  </div>

  <!-- 自传奖状 -->
  <div id="tabSelfReport" style="display:none">
    <div class="card">
      <div class="card-h">
        <div class="icon gold">📤</div>
        <h2>自传奖状上传</h2>
        <div class="sub">分享你获得的荣誉</div>
      </div>
      <div class="upload-form">
        <div class="drop-area" id="dropArea" onclick="document.getElementById('awardFileInput').click()">
          <div class="e">📸</div>
          <div class="t">点击上传奖状照片</div>
          <div class="s" id="fileName">支持 JPG / PNG / PDF</div>
        </div>
        <input type="file" id="awardFileInput" accept="image/*,.pdf" style="display:none" onchange="handleFilePick(event)">
        <div class="fields">
          <div class="field">
            <label>奖状名称</label>
            <input id="sraName" placeholder="如：2026年区级三好学生">
          </div>
          <div class="field">
            <label>颁发级别</label>
            <select id="sraLevel">
              <option value="school">校级</option>
              <option value="district">区级</option>
              <option value="city">市级</option>
              <option value="national">国家级</option>
            </select>
          </div>
          <div class="field">
            <label>颁发方</label>
            <input id="sraIssuer" placeholder="如：宝山区教育局">
          </div>
          <div class="field">
            <label>获奖日期</label>
            <input type="date" id="sraDate">
          </div>
        </div>
        <button class="submit-btn" onclick="submitSelfReport()">📤 提交审核</button>
        <div id="sraStatus" style="margin-top:10px;font-weight:800;font-size:13px;color:#2E7D32"></div>
      </div>
    </div>
  </div>
</div>

<!-- AI 颁奖辞弹窗 -->
<div class="veil" id="speechVeil">
  <div class="modal">
    <button class="close-btn" onclick="closeSpeech()">✕</button>
    <h3>✨ AI 颁奖辞</h3>
    <div id="speechContent" style="font-size:14px;line-height:1.8;color:#1F3A4D;white-space:pre-wrap;padding:14px;background:#FFF8E1;border-radius:14px">
      正在生成…
    </div>
  </div>
</div>

<!-- Confetti 容器 -->
<div class="confetti-container" id="confetti"></div>

<div class="toast" id="toast"></div>

<script>
// ============ 工具 ============
function getToken(){ return (window.UserAuth&&UserAuth.getToken)?UserAuth.getToken():sessionStorage.getItem('bs_session_token')||''; }
function getIdCard(){
  if(window.UserAuth&&UserAuth.getIdCard) return UserAuth.getIdCard();
  if(window.UserAuth&&UserAuth.getCurrentIdCard) return UserAuth.getCurrentIdCard();
  return 'demo_001';
}
async function api(path, opts={}){
  const token = getToken();
  const headers = opts.headers||{};
  if(token) headers['Authorization'] = 'Bearer '+token;
  const res = await fetch(location.origin+path,{...opts,headers});
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
function goHome(){ location.href='island-homepage.html'; }
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

// ============ Tab ============
let currentTab = 'pending';
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tabs .tab').forEach((b,i)=>{
    b.classList.toggle('active', b.textContent.includes(tab==='pending'?'待领取':tab==='claimed'?'已获得':'自传'));
  });
  document.getElementById('tabPending').style.display = tab==='pending'?'block':'none';
  document.getElementById('tabClaimed').style.display = tab==='claimed'?'block':'none';
  document.getElementById('tabSelfReport').style.display = tab==='self_report'?'block':'none';
  if(tab==='pending') loadPending();
  else if(tab==='claimed') loadClaimed();
}

// ============ 高光时刻 ============
async function loadHighlights(){
  try{
    const data = await api('/api/awards/highlights/'+encodeURIComponent(getIdCard()));
    const items = data.highlights||data||[];
    const grid = document.getElementById('heroGrid');
    if(!Array.isArray(items)||!items.length){
      grid.innerHTML = '<div class="hero-item" style="grid-column:1/-1;background:transparent;border-style:dashed;color:#7BB8DA;padding:30px">暂无高光时刻数据</div>';
      return;
    }
    const levelBadge = {national:'gold',city:'silver',district:'bronze',school:'special'};
    const levelLabel = {national:'国家级',city:'市级',district:'区级',school:'校级'};
    const trophies = ['🏆','🥇','🎖️','⭐','🏅','👑'];
    grid.innerHTML = items.slice(0,4).map((a,i)=>{
      const lvl = (a.level||'school').toLowerCase();
      return `
      <div class="hero-item" onclick="generateSpeech('${a.id||a.award_id||i}','${(a.name||a.award_name||'').replace(/'/g,"\\'")}')">
        <span class="badge ${levelBadge[lvl]||'gold'}">${levelLabel[lvl]||lvl}</span>
        <div class="trophy">${trophies[i]||'🏅'}</div>
        <div class="nm">${a.name||a.award_name||'荣誉奖状'}</div>
        <div class="from">${a.issuer||a.from||''} · ${(a.date||a.award_date||'').slice(0,4)}</div>
      </div>`;
    }).join('');
  }catch(e){ console.log('高光时刻加载失败:',e); }
}

// ============ 待领取 ============
async function loadPending(){
  const grid = document.getElementById('pendingGrid');
  try{
    const data = await api('/api/awards/student/'+encodeURIComponent(getIdCard()));
    const items = data.pending||data.awards||data||[];
    const pending = Array.isArray(items)?items.filter(a=>!a.claimed&&a.status!=='claimed'):[];
    document.getElementById('pendingCount').textContent = pending.length+' 项';
    if(!pending.length){ grid.innerHTML='<div style="padding:30px;text-align:center;color:#7BB8DA;font-weight:700;grid-column:1/-1">🎉 没有待领取的奖状，棒棒哒！</div>'; return; }
    const levelLabel = {national:'国家级',city:'市级',district:'区级',school:'校级'};
    grid.innerHTML = pending.map(a=>`
      <div class="award-card">
        <div class="seal">🎖️</div>
        <div class="info">
          <div class="nm">${a.name||a.award_name||'荣誉奖状'}</div>
          <span class="level ${(a.level||'school').toLowerCase()}">${levelLabel[a.level]||a.level||'校级'}</span>
          <div class="from">📌 ${a.issuer||a.from||'宝山区实验小学'}</div>
          <div class="date">📅 ${(a.date||a.award_date||'').slice(0,10)}</div>
          <div class="actions">
            <button class="claim-btn claim" onclick="claimAward(${a.id||a.award_id}, this)">🎖️ 领取</button>
            <button class="claim-btn speech" onclick="generateSpeech('${a.id||a.award_id}','${(a.name||a.award_name||'').replace(/'/g,"\\'")}')">✨ AI致辞</button>
          </div>
        </div>
      </div>
    `).join('');
  }catch(e){ grid.innerHTML=`<div style="padding:20px;color:#D84315;grid-column:1/-1">加载失败：${e.message}</div>`; }
}

async function claimAward(awardId, btn){
  btn.disabled=true; btn.textContent='领取中…';
  try{
    await api('/api/awards/claim/'+awardId, {method:'POST'});
    btn.className='claim-btn claimed'; btn.textContent='✅ 已领取';
    showToast('🎉 奖状已领取！');
    spawnConfetti();
    setTimeout(()=>{ loadPending(); loadHighlights(); }, 1500);
  }catch(e){
    btn.disabled=false; btn.textContent='🎖️ 领取';
    showToast('领取失败：'+e.message);
  }
}

// ============ 已获得 ============
async function loadClaimed(){
  const tl = document.getElementById('claimedTimeline');
  try{
    const data = await api('/api/awards/student/'+encodeURIComponent(getIdCard()));
    const items = data.claimed||data.awards||data||[];
    const claimed = Array.isArray(items)?items.filter(a=>a.claimed||a.status==='claimed'):[];
    document.getElementById('claimedCount').textContent = claimed.length+' 项';
    if(!claimed.length){ tl.innerHTML='<div style="padding:30px;text-align:center;color:#7BB8DA;font-weight:700">还没有获得的奖状，去领取吧！</div>'; return; }
    const levelLabel = {national:'国家级',city:'市级',district:'区级',school:'校级'};
    tl.innerHTML = claimed.map(a=>`
      <div class="tl-item">
        <div class="award-card" style="border-color:#C8E6C9;background:linear-gradient(135deg,#fff,#F1F8E9)">
          <div class="seal" style="background:linear-gradient(135deg,#E8F5E9,#C8E6C9);border-color:#4CAF50">✅</div>
          <div class="info">
            <div class="nm">${a.name||a.award_name||'荣誉奖状'}</div>
            <span class="level ${(a.level||'school').toLowerCase()}">${levelLabel[a.level]||a.level||'校级'}</span>
            <div class="from">📌 ${a.issuer||a.from||'宝山区实验小学'}</div>
            <div class="date">📅 ${(a.date||a.award_date||a.claimed_at||'').slice(0,10)}</div>
            <div class="actions">
              <button class="claim-btn speech" onclick="generateSpeech('${a.id||a.award_id}','${(a.name||a.award_name||'').replace(/'/g,"\\'")}')">✨ AI致辞</button>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }catch(e){ tl.innerHTML=`<div style="padding:20px;color:#D84315">加载失败：${e.message}</div>`; }
}

// ============ AI 颁奖辞 ============
async function generateSpeech(awardId, awardName){
  document.getElementById('speechVeil').classList.add('show');
  document.getElementById('speechContent').textContent = '✨ AI 正在为你撰写专属颁奖辞…';
  try{
    const data = await api('/api/awards/ai-speech', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ award_id: awardId, id_card: getIdCard() })
    });
    document.getElementById('speechContent').textContent = data.speech||data.content||data.text||'🎉 恭喜你获得这项荣誉！这是你努力的成果，继续加油！';
  }catch(e){ document.getElementById('speechContent').textContent = '生成失败：'+e.message; }
}

function closeSpeech(){ document.getElementById('speechVeil').classList.remove('show'); }

// ============ 自传奖状 ============
let selfReportFile = null;
function handleFilePick(e){
  const f = e.target.files[0];
  if(!f) return;
  selfReportFile = f;
  document.getElementById('fileName').textContent = '已选：'+f.name+' ('+(f.size/1024).toFixed(0)+' KB)';
}
async function submitSelfReport(){
  if(!selfReportFile){ showToast('请先选择奖状照片'); return; }
  const name = document.getElementById('sraName').value.trim();
  if(!name){ showToast('请输入奖状名称'); return; }
  const formData = new FormData();
  formData.append('file', selfReportFile);
  formData.append('name', name);
  formData.append('level', document.getElementById('sraLevel').value);
  formData.append('issuer', document.getElementById('sraIssuer').value.trim());
  formData.append('date', document.getElementById('sraDate').value);
  formData.append('id_card', getIdCard());
  try{
    const token = getToken();
    const headers = {};
    if(token) headers['Authorization'] = 'Bearer '+token;
    const res = await fetch(location.origin+'/api/awards/self-report', {method:'POST',headers,body:formData});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    showToast('✅ 已提交审核！');
    document.getElementById('sraStatus').textContent = '📬 已提交，等待老师审核…';
    document.getElementById('sraName').value='';document.getElementById('sraIssuer').value='';
    document.getElementById('sraDate').value='';selfReportFile=null;
    document.getElementById('fileName').textContent='支持 JPG / PNG / PDF';
  }catch(e){ showToast('提交失败：'+e.message); }
}

// ============ Confetti 动画 ============
function spawnConfetti(){
  const c = document.getElementById('confetti');
  const colors = ['#FFD54F','#FF9800','#F44336','#4CAF50','#2196F3','#9C27B0','#FF5722'];
  for(let i=0;i<50;i++){
    const d=document.createElement('div');
    d.className='confetti';
    d.style.left=Math.random()*100+'%';
    d.style.top=-(Math.random()*30)+'px';
    d.style.width=(6+Math.random()*10)+'px';
    d.style.height=(6+Math.random()*10)+'px';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDelay=Math.random()*1+'s';
    d.style.animationDuration=(1.5+Math.random()*2)+'s';
    d.style.borderRadius=Math.random()>.5?'50%':'2px';
    c.appendChild(d);
    setTimeout(()=>d.remove(),3000);
  }
}

// ============ 初始化 ============
(function init(){
  loadHighlights();
  loadPending();
  if(window.UserAuth){ UserAuth.ready(()=>{
    const info = UserAuth.getCurrentStudentInfo&&UserAuth.getCurrentStudentInfo();
    if(!info) return;
    document.getElementById('stuAvatar').textContent=(info.displayName||'生').charAt(0);
    document.getElementById('stuName').textContent=info.displayName||'***';
    document.getElementById('stuMeta').textContent=(info.grade||'')+' · '+(info.class||'');
  });}
})();
</script>
