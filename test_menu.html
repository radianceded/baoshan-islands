<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>菜单数据测试</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 20px; }
.card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin: 10px 0; }
.error { color: #e55; background: #fee; padding: 10px; border-radius: 4px; }
.success { color: #2a7; background: #efe; padding: 10px; border-radius: 4px; }
pre { background: #f5f5f5; padding: 10px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>
<h2>🍽️ 食堂菜单数据测试</h2>
<div id="result"></div>

<script src="js/menu_data.js"></script>
<script>
const result = document.getElementById('result');

// 检查 MENU_DATABASE 是否存在
if (typeof MENU_DATABASE === 'undefined') {
  result.innerHTML = '<div class="error">❌ MENU_DATABASE 未定义！请检查 js/menu_data.js 是否正确加载</div>';
} else {
  const weeks = Object.keys(MENU_DATABASE);
  let html = '<div class="success">✅ MENU_DATABASE 加载成功</div>';
  html += '<p>包含周次: ' + weeks.join(', ') + '</p>';
  
  // 显示第1周数据样例
  if (MENU_DATABASE['1']) {
    const w1 = MENU_DATABASE['1'];
    html += '<div class="card">';
    html += '<h3>第1周数据样例</h3>';
    html += '<pre>' + JSON.stringify(w1, null, 2).substring(0, 2000) + '...</pre>';
    html += '</div>';
    
    // 显示周一AB餐
    if (w1.days && w1.days['周一']) {
      const mon = w1.days['周一'];
      html += '<div class="card">';
      html += '<h3>第1周 周一</h3>';
      html += '<h4>A餐:</h4><pre>' + JSON.stringify(mon.A, null, 2) + '</pre>';
      html += '<h4>B餐:</h4><pre>' + JSON.stringify(mon.B, null, 2) + '</pre>';
      html += '</div>';
    }
  }
  
  result.innerHTML = html;
}
</script>
</body>
</html>
